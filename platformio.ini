; ai-cam-bridge — XIAO ESP32-C3 firmware that bridges Grove Vision AI V2
; detections to a Meshtastic Serial-module node.
;
; Phase 1: probe sketch — discover what the C3 in the AI socket can see.

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; NimBLE role pruning is safe (just disables unused code paths). The
    ; size constraints (MAX_CONNECTIONS / MAX_BONDS) were removed 2026-05-11
    ; because they correlated with heap aliasing crashes against the SSCMA
    ; JSON buffers - NimBLE's defaults give it more breathing room.
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
lib_deps =
    Seeed-Studio/Seeed_Arduino_SSCMA
    bblanchon/ArduinoJson @ ^7
    h2zero/NimBLE-Arduino @ ~2.3.9
